name: Publish to npm

# Tag-triggered release pipeline, mirroring covia-sdk-py's publish.yml:
# push a tag `v<version>` matching package.json and this validates, tests,
# publishes a stable release to npm, and creates a GitHub release. Prerelease
# packages are deliberately kept out of npm so temporary dist-tags cannot
# outlive their release line; use `pnpm pack` for release candidates.
#
# Auth is npm "trusted publishing" (OIDC) — no token secret required.
# One-time setup on npmjs.com: package @covia/covia-sdk → Settings →
# Trusted Publisher → GitHub Actions, repository covia-ai/covia-sdk,
# workflow publish.yml. Publishes from this workflow then need no OTP
# and carry provenance automatically.

on:
  push:
    tags: ["v*"]

# Read-only by default; publish (id-token) and github-release (contents)
# request their extra scopes at job level.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-*)
              echo "::error::Prerelease version $VERSION is not published to npm"
              echo "Use pnpm pack from a CI-validated commit for release candidates"
              exit 1
              ;;
          esac

  publish:
    needs: [ci, validate-tag]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1. Node 24 bundles a new
      # enough npm; unconditionally overlaying npm@latest broke the 1.7.0
      # publish (global install missing its sigstore module), so only
      # upgrade — pinned to major 11 — if the bundled npm is too old.
      - name: Ensure npm >= 11.5.1
        run: |
          V=$(npm --version)
          echo "Bundled npm: $V"
          if [ "$(printf '%s\n' 11.5.1 "$V" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $V < 11.5.1 — installing npm@11"
            npm install -g npm@11
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dist-tags persist until a maintainer removes them; publishing a stable
      # version under `latest` does not clear an older `next`, `beta`, or `rc`.
      # Refuse to publish if registry state has drifted from the stable-only
      # policy so the problem is detected before the irreversible publish.
      - name: Verify stable-only dist-tag policy
        run: |
          TAGS=$(npm view @covia/covia-sdk dist-tags --json)
          node - "$TAGS" <<'NODE'
          const tags = JSON.parse(process.argv[2]);
          const unexpected = Object.keys(tags).filter((tag) => tag !== "latest");
          if (unexpected.length) {
            console.error(`::error::Unexpected npm dist-tags: ${unexpected.join(", ")}`);
            console.error("Remove them interactively before publishing a stable release.");
            process.exit(1);
          }
          console.log(`npm dist-tag policy OK: latest=${tags.latest}`);
          NODE

      # prepublishOnly runs the build and unit tests again as a final gate.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing stable release $VERSION under dist-tag latest"
          npm publish --tag latest

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "## @covia/covia-sdk $TAG

          Published to [npm](https://www.npmjs.com/package/@covia/covia-sdk)."
