name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Nightly run against the venue's develop image (:latest) catches API drift
  # before it reaches a release; PRs use the pinned release image.
  schedule:
    - cron: '0 3 * * *'
  workflow_call:
  workflow_dispatch:
    inputs:
      venue_tag:
        description: 'Venue image tag for the integration job (blank = pinned release)'
        required: false
        default: ''

# Read-only token: CI only checks out, builds and tests.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

  integration:
    runs-on: ubuntu-latest
    env:
      VENUE_IMAGE: ghcr.io/covia-ai/covia:${{ inputs.venue_tag || (github.event_name == 'schedule' && 'latest') || '0.9.8' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Throwaway venue (temp store, public unrestricted access) — see
      # .github/integration/start-venue.sh
      - name: Start venue
        run: .github/integration/start-venue.sh

      - name: Integration tests
        run: pnpm run test:integration

      - name: Venue logs
        if: failure()
        run: docker logs covia-sdk-it-venue || true
