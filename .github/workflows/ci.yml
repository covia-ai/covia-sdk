name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Nightly run against the venue's develop image (:latest) catches API drift
  # before it reaches a release; PRs use the pinned release image.
  schedule:
    - cron: '0 3 * * *'
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

  integration:
    runs-on: ubuntu-latest
    env:
      VENUE_IMAGE: ghcr.io/covia-ai/covia:${{ github.event_name == 'schedule' && 'latest' || '0.9.8' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Throwaway venue (temp store, public unrestricted access) — see
      # .github/integration/start-venue.sh
      - name: Start venue
        run: .github/integration/start-venue.sh

      - name: Integration tests
        run: pnpm run test:integration

      - name: Venue logs
        if: failure()
        run: docker logs covia-sdk-it-venue || true
